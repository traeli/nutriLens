services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrilens-pg
    environment:
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens123
      POSTGRES_DB: nutrilens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    container_name: nutrilens-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/config/config.yaml:/app/config/config.yaml:ro
      - server_uploads:/app/uploads
    restart: unless-stopped

  directus:
    image: directus/directus:latest
    profiles: ["admin"]
    container_name: nutrilens-directus
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-change-before-enabling-admin-profile}
      SECRET: ${DIRECTUS_SECRET:-change-before-enabling-admin-profile}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.invalid}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-before-enabling-admin-profile}
      DB_CLIENT: 'pg'
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_USER: nutrilens
      DB_PASSWORD: nutrilens123
      DB_DATABASE: nutrilens
      WEBSOCKETS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus_data:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  pgdata:
  server_uploads:
  directus_data:
  directus_extensions:
