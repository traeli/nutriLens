services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrilens-pg
    environment:
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens123
      POSTGRES_DB: nutrilens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  directus:
    image: directus/directus:latest
    profiles: ["admin"]
    container_name: nutrilens-directus
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-change-before-enabling-admin-profile}
      SECRET: ${DIRECTUS_SECRET:-change-before-enabling-admin-profile}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.invalid}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-before-enabling-admin-profile}
      DB_CLIENT: 'pg'
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_USER: nutrilens
      DB_PASSWORD: nutrilens123
      DB_DATABASE: nutrilens
      WEBSOCKETS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus_data:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  pgdata:
  redisdata:
  server_uploads:
  directus_data:
  directus_extensions:
