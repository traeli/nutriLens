version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrilens-pg
    environment:
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens123
      POSTGRES_DB: nutrilens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrilens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nutrilens-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
