server:
  addr: ":8080"

database:
  # 仅用于本机 Docker 开发数据库，请勿复用于生产环境。
  dsn: "host=127.0.0.1 user=nutrilens password=nutrilens123 dbname=nutrilens port=5432 sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  # 本地开发值；部署前请替换为安全随机值，且不要提交真实密钥。
  secret: "local-development-secret-change-me"
  expire_hours: 168

wechat:
  app_id: ""
  app_secret: ""

bailian:
  # 仅在服务端填写，禁止放入小程序代码或提交真实 API Key。
  api_key: ""
  # 生产环境建议替换为百炼业务空间专属的 compatible-mode/v1 地址。
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  asr_model: "qwen3-asr-flash"

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

storage:
  upload_dir: "./uploads"
  public_base_url: "http://127.0.0.1:8080/uploads"

security:
  # 32 字节随机值的 Base64；生产环境必须通过 DATA_ENCRYPTION_KEY 注入。
  data_encryption_key: ""
  allow_mock_login: true
