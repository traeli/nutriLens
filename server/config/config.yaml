server:
  addr: ":8080"

database:
  # Docker Compose 内通过服务名 postgres 连接数据库。
  dsn: "host=127.0.0.1 user=nutrilens password=nutrilens123 dbname=nutrilens port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  check_timeout: 5s

redis:
  dsn: "redis://127.0.0.1:6379/0"
  pool_size: 20
  min_idle_conns: 2
  max_idle_conns: 10
  conn_max_idle_time: 10m
  conn_max_lifetime: 30m
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  check_timeout: 5s
jwt:
  # 部署前请直接替换为安全随机值，且不要提交生产使用的真实密钥。
  secret: "local-development-secret-change-me"
  expire_hours: 2

