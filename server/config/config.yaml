server:
  addr: ":8080"

database:
  # Docker Compose 内通过服务名 postgres 连接数据库。
  dsn: "host=postgres user=nutrilens password=nutrilens123 dbname=nutrilens port=5432 sslmode=disable TimeZone=Asia/Shanghai"

jwt:
  # 部署前请直接替换为安全随机值，且不要提交生产使用的真实密钥。
  secret: "local-development-secret-change-me"
  expire_hours: 168

wechat:
  app_id: ""
  app_secret: ""

bailian:
  # 仅在服务端填写，禁止放入小程序代码或提交真实 API Key。
  api_key: ""
  # 生产环境建议替换为百炼业务空间专属的 compatible-mode/v1 地址。
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  asr_model: "qwen3-asr-flash"

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

storage:
  upload_dir: "/app/uploads"
  public_base_url: "https://nutrilens.cloud/uploads"

security:
  # 直接填写 32 字节随机值的 Base64；可用 openssl rand -base64 32 生成。
  data_encryption_key: ""
  allow_mock_login: false
